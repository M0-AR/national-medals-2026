services:
  research:
    build: .
    container_name: medals2026-research
    volumes:
      - ./:/repo
      - ./data:/repo/data
      - ./benchmarks:/repo/benchmarks
    working_dir: /repo
    command: bash scripts/run_all.sh
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC

  lab:
    build: .
    container_name: medals2026-lab
    ports:
      - "8888:8888"
    volumes:
      - ./:/repo
    working_dir: /repo
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''

  docs:
    image: python:3.11-slim
    container_name: medals2026-docs
    volumes:
      - ./:/repo
    working_dir: /repo
    command: python -m http.server 8000
    ports:
      - "8000:8000"
